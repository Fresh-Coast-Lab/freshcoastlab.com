  <g transform="translate(32 32)" fill="#F2E6CE" opacity="0.18">
    <path d="M0 -24 L3 -3 L24 0 L3 3 L0 24 L-3 3 L-24 0 L-3 -3 Z"/>
  </g>
  <!-- FC letters -->
  <text x="32" y="42" text-anchor="middle"
        font-family="Bungee Inline, Anton, Impact, sans-serif"
        font-size="28" font-weight="900"
        fill="#F2E6CE" letter-spacing="-1">F<tspan fill="#D55A2F">C</tspan></text>
</svg>
